services:

  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    restart: unless-stopped

    ports:
      # Kafka accessible depuis ton Mac
      - "9094:9094"

    environment:
      # ----------------------------------------------------------
      # KRaft
      # ----------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ----------------------------------------------------------
      # Listeners
      # ----------------------------------------------------------
      # INTERNAL = communication entre les conteneurs
      # EXTERNAL = communication depuis ton Mac
      # CONTROLLER = communication KRaft
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ----------------------------------------------------------
      # Single-node development configuration
      # ----------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - trading_network


  # ============================================================
  # POSTGRESQL - CONDUKTOR
  # ============================================================

  conduktor-postgres:
    image: postgres:17
    container_name: conduktor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: conduktor
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor

    volumes:
      - conduktor_postgres_data:/var/lib/postgresql/data

    networks:
      - trading_network


  # ============================================================
  # POSTGRESQL - TRADING PLATFORM
  # ============================================================

  trading-postgres:
    image: postgres:17
    container_name: trading-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading

    ports:
      # Accessible depuis ton Mac
      - "5432:5432"

    volumes:
      - trading_postgres_data:/var/lib/postgresql/data

    networks:
      - trading_network


  # ============================================================
  # CONDUKTOR
  # ============================================================

  conduktor:
    image: conduktor/conduktor-console:1.47.2
    container_name: conduktor
    restart: unless-stopped

    depends_on:
      - kafka
      - conduktor-postgres

    ports:
      - "8080:8080"

    environment:
      # ----------------------------------------------------------
      # Conduktor database
      # ----------------------------------------------------------
      CDK_DATABASE_URL: postgresql://conduktor:conduktor@conduktor-postgres:5432/conduktor

      # ----------------------------------------------------------
      # Kafka cluster
      # ----------------------------------------------------------
      CDK_CLUSTERS_0_ID: kafka
      CDK_CLUSTERS_0_NAME: Local Kafka
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      # ----------------------------------------------------------
      # Development authentication
      # ----------------------------------------------------------
      CDK_AUTH_MODE: no-auth

    networks:
      - trading_network


# ============================================================
# VOLUMES
# ============================================================

volumes:

  # Kafka data
  kafka_data:

  # Conduktor internal database
  conduktor_postgres_data:

  # Trading platform database
  trading_postgres_data:


# ============================================================
# NETWORK
# ============================================================

networks:

  trading_network:
    driver: bridge